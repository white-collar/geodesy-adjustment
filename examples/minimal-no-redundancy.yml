# Минимальный учебный пример — БЕЗ избыточных измерений.
#
# 2 известных пункта (A, B), 1 определяемая точка (C).
# Измерений ровно столько, сколько неизвестных: 2 измерения (угол + расстояние)
# на 2 неизвестных (Cx, Cy). Степени свободы = 2 - 2 = 0.
#
# Это значит: система решается ОДНОЗНАЧНО и ТОЧНО, без всякого "уравнивания"
# в статистическом смысле — тут нечего согласовывать между избыточными
# данными, потому что избыточных данных нет. σ0 (апостериорная точность)
# в таком случае невычислима (нет с чем сравнивать) — интерфейс покажет
# σ0 = "—", и это ожидаемо, а не ошибка.
#
# Единицы: distance в метрах; value для angle — в градусах; sigma — в угловых секундах.

meta:
  project: Учебный пример — сеть без избыточных измерений
  notes: Угол в точке A между направлением на B и направлением на C, плюс расстояние A-C. Добавь ещё одно измерение (например distance B-C) и посмотри, как появляется невязка и σ0 перестаёт быть "—".

defaults:
  sigma_distance: 0.005
  sigma_angular: 0.6

reference_points:
  - {id: A, x: 0.0, y: 0.0}
  - {id: B, x: 0.0, y: 1000.0}

observations:
  - {type: angle,    from: A, to: B, to2: C, value: -69.443955}
  - {type: distance, from: A, to: C,         value: 854.4004}
